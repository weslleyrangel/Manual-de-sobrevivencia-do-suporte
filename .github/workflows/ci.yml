name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Wait for Database to be Ready
        run: |
          echo "Waiting for PostgreSQL to start..."
          for i in {1..15}; do
            docker compose exec -T db pg_isready -U postgres -h localhost && break
            echo "Waiting..."
            sleep 2
          done

      - name: Install Frontend Dependencies
        # Apenas para garantir caso o container levante muito rápido sem ter concluído os módulos locais
        run: docker compose exec -T frontend npm install

      - name: Install Backend Dependencies
        run: docker compose exec -T backend npm install

      - name: Run Backend Tests
        run: docker compose exec -T backend npm test

      - name: Run Frontend Tests
        run: docker compose exec -T frontend npm run test -- --run

      - name: Run Frontend Build
        run: docker compose exec -T frontend npm run build

      - name: Capture Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo "=== Frontend Logs ==="
          docker compose logs frontend
          echo "=== Database Logs ==="
          docker compose logs db
